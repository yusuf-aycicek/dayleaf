name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Validate content
        run: dart run tools/validate_content.dart

      # Golden tests are excluded: font rasterization differs between the
      # Windows machine that generated them and Linux. Size, safe-area and
      # contrast tests still run here.
      - name: Test
        run: flutter test --exclude-tags golden
