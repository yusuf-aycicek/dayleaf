name: dailywall
description: "Daily wallpapers generated on-device from your interests."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  wallpaper_bridge:
    path: packages/wallpaper_bridge
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true

  # Fonts are bundled (SIL Open Font License, see assets/fonts/OFL-*.txt).
  # Nothing is downloaded at runtime.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

  assets:
    - assets/fonts/
    - assets/content/
